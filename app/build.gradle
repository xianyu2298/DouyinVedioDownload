plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.xianyu.vediodownload'
    compileSdk 34

        repositories {

    }

    defaultConfig {
        applicationId "com.xianyu.vediodownload"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "1.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    // 签名配置从根目录 keystore.properties 读取（该文件已加入 .gitignore，不提交密码）。
    // 文件格式：
    //   storeFile=E:/软件签名/抖音无水印下载.jks
    //   storePassword=***
    //   keyAlias=***
    //   keyPassword=***
    def keystorePropsFile = rootProject.file("keystore.properties")
    if (keystorePropsFile.exists()) {
        def props = new Properties()
        keystorePropsFile.withInputStream { props.load(it) }
        signingConfigs {
            release {
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // 体积优化：R8 裁剪未使用代码 + 资源压缩（可剔除未引用字符串与 5000+ 未使用图标）
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation libs.exifinterface

    // FFmpeg Kit（本地 aar + jniLibs，用于抽帧与音频导出）
    implementation(name: 'ffmpeg-kit-full-gpl', ext: 'aar')
    implementation(name: 'smart-exception-common', ext: 'jar')
    implementation(name: 'smart-exception-java', ext: 'jar')


    // Compose BOM
    def composeBom = platform('androidx.compose:compose-bom:2023.10.01')
    implementation composeBom

    // Compose UI
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Activity Compose
    implementation 'androidx.activity:activity-compose:1.7.2'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.2'

    // OkHttp 4.x
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'

    // AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Material 必须保留：themes.xml 的 Theme.Material3.Light.NoActionBar 来自这里
    implementation 'com.google.android.material:material:1.11.0'

    // Annotation
    implementation 'androidx.annotation:annotation:1.7.1'

    // Coil for image loading
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // Media3 / ExoPlayer - 视频流式预览（边下边播 + 进度条）
    implementation libs.media3.exoplayer
    implementation libs.media3.ui

    // Debug
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
